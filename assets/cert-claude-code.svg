<svg xmlns="http://www.w3.org/2000/svg" width="230" height="295" viewBox="0 0 230 295">
<defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>
<style>
  .card { fill: #0c0604; stroke: #ff6a00; stroke-width: 1.5; stroke-dasharray: 1200; stroke-dashoffset: 1200;
          animation: draw 1.4s ease forwards, pulse 3s ease-in-out 2.5s infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pulse { 50% { stroke: #ff2a2a; } }
  .icon { fill: none; stroke: #ffb000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
          opacity: 0; animation: fade .6s ease .6s forwards; filter: url(#glow); }
  .cursor { animation: blink2 1s steps(1) infinite; }
  @keyframes blink2 { 50% { opacity: 0; } }
  .ctitle { font: 700 16px Consolas, Menlo, monospace; letter-spacing: 3px; fill: #ff6a00; text-anchor: middle;
            opacity: 0; animation: fade .6s ease .8s forwards; filter: url(#glow); }
  .name { font: 700 13px Consolas, Menlo, monospace; fill: #ffb000; text-anchor: middle; opacity: 0; animation: fade .6s ease 1.1s forwards; }
  .sep { stroke: #ff2a2a; stroke-opacity: .6; stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw .8s ease 1s forwards; }
  .item { font: 13px Consolas, Menlo, monospace; fill: #ffd9bf; text-anchor: middle; opacity: 0; animation: up .5s ease forwards; }
  .arrow { font: 700 13px Consolas, Menlo, monospace; fill: #ff2a2a; text-anchor: middle; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(5px); } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
<rect class="card" x="2" y="2" width="226" height="291" rx="10"/>
<g class="icon" transform="translate(115.0,48)"><rect x="-21" y="-16" width="42" height="32" rx="4"/><path d="M-13 -5 L-6 1 L-13 7"/>
<line class="cursor" x1="-2" y1="8" x2="10" y2="8"/></g>
<text class="ctitle" x="115.0" y="100">ANTHROPIC</text>
<text class="name" x="115.0" y="128">Claude Code</text><text class="name" x="115.0" y="147">in Action</text>
<line class="sep" x1="22" y1="172" x2="208" y2="172"/>
<text class="item" x="115.0" y="200" style="animation-delay:1.50s">Skilljar course</text><text class="item" x="115.0" y="222" style="animation-delay:1.65s">verified</text>
<text class="arrow" x="115.0" y="275">verify →</text>
</svg>